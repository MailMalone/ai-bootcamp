[project]
name = "ai-bootcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ApexDelta", email = "66366373+MailMalone@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-bootcamp = "ai_bootcamp:main"
ai-triage = "ai_bootcamp.triage:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv.build-backend]
module-name = ["ai_bootcamp", "tickets"]
